[project]
name = "backend"
version = "0.1.0"
description = "team5 main project"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "django>=5.2.7,<5.3",
    "djangorestframework>=3.16.1,<3.17"
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-django",
    "coverage",
    "python-dotenv"
]

prod = [
    "gunicorn>=21.0.0,<22.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0"
]