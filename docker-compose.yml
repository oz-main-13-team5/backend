services:
  db:
    image: postgres:14-alpine
    restart: always
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${DB_NAME:-backend}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oz_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-backend}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: /app/scripts/run.sh
    env_file:
      - .env.local
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles

volumes:
  postgres_data:
  staticfiles:
