name: Code Quality Checks

on:
  push:
    branches:
      - feat/ci-test
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432:5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Packages & Libraries
        run: uv sync --dev

      - name: Wait for Postgres (robust)
        timeout-minutes: 3
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432:5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        run: |
          set -euo pipefail
          unset DATABASE_URL
          echo "Using pg_isready..."
          for i in {1..90}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              echo "Postgres is ready on $PGHOST:$PGPORT"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres not ready in time"
          echo "DBG: HOST=$PGHOST PORT=$PGPORT USER=$POSTGRES_USER DB=$POSTGRES_DB"
          exit 1

      # ... existing code ...
