name: Code Quality Checks

on:
  push:
    branches:
      - feat/ci-test
  pull_request:
    branches:
      - feat/ci-test

jobs:
  ci:
    runs-on: ubuntu-latest
    
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: dummy-secret-for-ci-only
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SETTINGS_MODULE: config.settings.dev
      ENV: dev

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Packages & Libraries
        run: uv sync --dev

      - name: Wait for Postgres (robust)
        timeout-minutes: 3
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        run: |
          set -euo pipefail
          unset DATABASE_URL

          if command -v pg_isready >/dev/null 2>&1; then
            echo "Using pg_isready..."
            for i in {1..45}; do  # 최대 ~90초
              if pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                echo "Postgres is ready."
                exit 0
              fi
              sleep 2
            done
          else
            echo "pg_isready not found; falling back to TCP probe..."
            for i in {1..45}; do
              (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && { echo "TCP port open."; exit 0; }
              sleep 2
            done
          fi

          echo "Postgres not ready in time"
          echo "DBG: HOST=postgres PORT=5432 USER=${POSTGRES_USER} DB=${POSTGRES_DB}"
          exit 1

      # ... existing code ...
